services:
  - type: web
    name: ali-pmo-api
    runtime: python
    rootDir: ali-pmo/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ALI_PMO_PAYMENT_REQUIRED
        value: "true"
      - key: ALI_PMO_PUBLIC_APP_URL
        value: https://your-netlify-site.netlify.app
      - key: ALI_PMO_PUBLIC_API_URL
        value: https://ali-pmo-api.onrender.com
      - key: ALI_PMO_CORS_ORIGINS
        value: https://your-netlify-site.netlify.app
      - key: TAP_API_BASE_URL
        value: https://api.tap.company/v2
      - key: TAP_SOURCE_ID
        value: src_all
      - key: TAP_SAVE_CARD
        value: "false"
      - key: TAP_PLAN_AMOUNT
        value: "0.050"
      - key: TAP_PLAN_CURRENCY
        value: OMR
      - key: TAP_PLAN_INTERVAL_DAYS
        value: "30"
      - key: TAP_SECRET_KEY
        sync: false
      - key: TAP_MERCHANT_ID
        sync: false
